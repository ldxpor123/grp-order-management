<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Order Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script>
/* =====================================================================
   CONFIG — paste your Google Sheets "Publish to web" CSV links here.
   File > Share > Publish to web > pick the tab > "Comma-separated values (.csv)"
   They look like:
   https://docs.google.com/spreadsheets/d/e/2PACX-.../pub?gid=0&single=true&output=csv
   ===================================================================== */
const ORDERS_CSV_URL  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQGL1cbSbZfzIlYiQW1KW7eE8PIwRZ5c_tR9RM4tbJQruOyp9fKI9btjlnLxwJZP-2Aj833KYi3kOAC/pub?gid=863135978&single=true&output=csv";
const HANDLES_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQGL1cbSbZfzIlYiQW1KW7eE8PIwRZ5c_tR9RM4tbJQruOyp9fKI9btjlnLxwJZP-2Aj833KYi3kOAC/pub?gid=1367806110&single=true&output=csv";
/* ===================================================================== */
</script>
<style>
  :root {
    --bg: #f8f7f1;
    --surface: #f5f5f5;
    --stone: #e8e7e4;
    --sand: #ded8cf;
    --ink: #441009;
    --ink-soft: #7a625b;
    --ink-faint: #b7aaa3;
    --line: rgba(68, 16, 9, .14);
    --on-ink: #f8f7f1;
    --blob: #ded8cf;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1311; --surface: #221917; --stone: #2c221f; --sand: #3a2d28;
      --ink: #f3eee6; --ink-soft: #bfb2a8; --ink-faint: #6f625c;
      --line: rgba(243, 238, 230, .14); --on-ink: #1a1311; --blob: #3a2420;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1311; --surface: #221917; --stone: #2c221f; --sand: #3a2d28;
    --ink: #f3eee6; --ink-soft: #bfb2a8; --ink-faint: #6f625c;
    --line: rgba(243, 238, 230, .14); --on-ink: #1a1311; --blob: #3a2420;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: "Inter", "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic",
                 system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.5; letter-spacing: -.005em;
    -webkit-font-smoothing: antialiased; overflow-wrap: anywhere;
  }

  /* soft background shapes (decorative) */
  .deco { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .deco .blob { position: absolute; width: 520px; height: 520px; border-radius: 50%;
    background: var(--blob); filter: blur(90px); opacity: .7; top: -220px; right: -180px; }
  .deco .ring { position: absolute; width: 440px; height: 440px; border-radius: 50%;
    border: 1px solid var(--line); bottom: -200px; left: -170px; }

  .page { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto;
    padding: 0 20px 56px; padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right)); }

  /* top bar */
  .bar { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .brand { font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
  .brand span { color: var(--ink-faint); font-weight: 400; margin-left: 10px; }
  .theme-btn { border: 1px solid var(--line); background: transparent; color: var(--ink);
    width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
  .theme-btn svg { width: 16px; height: 16px; }

  /* layout */
  .layout { display: grid; gap: 8px; }
  .hero { padding: 40px 0 8px; }
  h1 { margin: 0; font-weight: 800; font-size: clamp(44px, 13vw, 88px); line-height: .95; letter-spacing: -.045em; text-transform: uppercase; }
  .hero .tag { font-size: clamp(18px, 4.6vw, 26px); font-weight: 400; margin: 10px 0 0; letter-spacing: -.02em; }
  .hero .lead { color: var(--ink-soft); margin: 14px 0 0; max-width: 34ch; }

  form.search { margin-top: 28px; display: flex; align-items: center; border: 1.5px solid var(--ink);
    border-radius: 999px; padding: 4px 4px 4px 20px; max-width: 440px; background: var(--bg); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink);
    font: inherit; font-size: 16px; padding: 10px 8px 10px 0; }
  .search input::placeholder { color: var(--ink-faint); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search button { flex: none; display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px;
    background: var(--ink); color: var(--on-ink); font: inherit; font-weight: 500; font-size: 15px; padding: 10px 18px; cursor: pointer; }
  .search button svg { width: 16px; height: 16px; }
  .search button:disabled { opacity: .5; cursor: progress; }
  form.search:focus-within { box-shadow: 0 0 0 4px var(--sand); }

  .msg { margin-top: 22px; color: var(--ink-soft); max-width: 440px; }
  .msg strong { color: var(--ink); font-weight: 600; }

  /* total */
  .total { margin-top: 32px; padding-top: 22px; border-top: 1px solid var(--line); max-width: 440px; }
  .hello { font-size: 13px; color: var(--ink-soft); }
  .total .label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-top: 14px; }
  .total .amount { font-size: clamp(44px, 12vw, 60px); font-weight: 300; letter-spacing: -.04em; line-height: 1.05;
    font-variant-numeric: tabular-nums; margin-top: 4px; }
  .total .hint { color: var(--ink-soft); font-size: 13px; margin-top: 6px; }
  .counts { display: flex; gap: 22px; margin-top: 18px; font-size: 13px; color: var(--ink-soft); }
  .counts b { display: block; color: var(--ink); font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }

  /* filter chips (like the brand filter row) */
  .chips-row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; margin-top: 8px; scrollbar-width: none; }
  .chips-row::-webkit-scrollbar { display: none; }
  .fchip { flex: none; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px;
    padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .fchip[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }

  /* sections & rows */
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; margin: 30px 0 0;
    padding-bottom: 12px; border-bottom: 1px solid var(--ink); }
  .sec-head h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .sec-head .n { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .empty { color: var(--ink-soft); font-size: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); margin: 0; }

  .row { padding: 18px 0; border-bottom: 1px solid var(--line); }
  .row-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
  .row-title { font-weight: 500; font-size: 15.5px; }
  .meta { display: flex; flex-wrap: wrap; column-gap: 14px; row-gap: 2px; margin-top: 4px; font-size: 13px;
    color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .meta .money { color: var(--ink); font-weight: 500; }

  .pill { flex: none; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    border-radius: 999px; padding: 4px 10px; white-space: nowrap; border: 1px solid var(--ink); }
  .pill.notpaid { background: var(--ink); color: var(--on-ink); }
  .pill.paid { background: transparent; color: var(--ink); }
  .pill.deducted { background: var(--sand); border-color: var(--sand); color: var(--ink); }
  .pill.credit { background: transparent; border-style: dashed; color: var(--ink); }
  .pill.tbc { background: transparent; border-color: var(--ink-faint); color: var(--ink-soft); }

  /* 4-step tracker */
  .tracker { list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); margin: 16px 0 0; padding: 0; }
  .tracker li { position: relative; padding-top: 16px; font-size: 11.5px; color: var(--ink-faint); }
  .tracker li::before { content: ""; position: absolute; top: 3px; left: 0; right: 0; height: 1px; background: var(--line); }
  .tracker li::after { content: ""; position: absolute; top: 0; left: 0; width: 7px; height: 7px; border-radius: 50%;
    background: var(--bg); border: 1px solid var(--ink-faint); }
  .tracker li:last-child::before { right: auto; width: 0; }
  .tracker li.done { color: var(--ink-soft); }
  .tracker li.done::before { background: var(--ink); }
  .tracker li.done::after { background: var(--ink); border-color: var(--ink); }
  .tracker li.now { color: var(--ink); font-weight: 600; }
  .tracker li.now::before { background: var(--line); }
  .tracker li.now::after { box-shadow: 0 0 0 4px var(--sand); }

  .stage { font-size: 13.5px; margin-top: 10px; font-weight: 500; }
  .note { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }

  footer { margin-top: 40px; font-size: 12px; color: var(--ink-faint); }

  .hidden { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* desktop: left column (title, search, total) stays put, items scroll on the right */
  @media (min-width: 900px) {
    .page { padding-left: 40px; padding-right: 40px; }
    .bar { height: 80px; }
    body.has-result .layout { grid-template-columns: minmax(320px, 400px) 1fr; gap: 72px; align-items: start; }
    body.has-result .side { position: sticky; top: 24px; }
    body.has-result h1 { font-size: 64px; }
    .hero { padding-top: 72px; }
    body:not(.has-result) .side { max-width: 720px; }
    body:not(.has-result) h1 { font-size: 112px; }
    .content { padding-top: 40px; }
  }
</style>
</head>
<body>
<div class="deco" aria-hidden="true"><div class="blob"></div><div class="ring"></div></div>

<div class="page">
  <div class="bar">
    <div class="brand">group order<span>JP → SG</span></div>
    <button class="theme-btn" id="theme" type="button" aria-label="Switch light / dark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    </button>
  </div>

  <div class="layout">
    <div class="side">
      <section class="hero">
        <h1>Orders</h1>
        <p class="tag">from Japan, to you.</p>
        <p class="lead">Type your name or Telegram @ to see your goods, what you've paid and where everything is.</p>

        <form class="search" id="form" autocomplete="off">
          <label for="q" class="sr">Your name or Telegram handle</label>
          <input id="q" name="q" type="search" autocapitalize="none" spellcheck="false" placeholder="@yourhandle" required>
          <button id="go" type="submit">Find
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </form>

        <p id="status" class="msg" role="status" aria-live="polite">Loading the order sheet…</p>
      </section>

      <section id="summary" class="total hidden" aria-live="polite"></section>
    </div>

    <main id="result" class="content hidden"></main>
  </div>

  <footer id="foot"></footer>
</div>

<script>
(function () {
  "use strict";

  const STEPS = ["Ordered", "At warehouse", "Shipping", "Delivered"];
  const STAGE_INDEX = { "ORDERED": 0, "AT WAREHOUSE": 1, "SHIPPING TO SG": 2, "SHIPPING": 2, "DELIVERED": 3 };
  const STAGE_LABEL = {
    "ORDERED": "Ordered, waiting for the Japan release",
    "AT WAREHOUSE": "Arrived at the Buy&Ship warehouse",
    "SHIPPING TO SG": "On the way to Singapore",
    "SHIPPING": "On the way to Singapore",
    "DELIVERED": "Delivered",
    "NO UPDATE": "No update yet"
  };
  const PAY_LABEL = { "PAID": "Paid", "NOT PAID": "Not paid", "DEDUCTED": "Deducted", "CREDIT": "Credit" };

  const $ = (id) => document.getElementById(id);
  const form = $("form"), input = $("q"), btn = $("go"), statusEl = $("status"),
        summaryEl = $("summary"), result = $("result");

  let data = null;        // { orders: [...], handles: [...] }
  let loadError = null;

  /* ---------- theme toggle (remembered on this device only) ---------- */
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  $("theme").addEventListener("click", () => {
    const cur = document.documentElement.dataset.theme ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch (e) {}
  });

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  // Exact, case-insensitive match key. "@XR", "xr", "ｘｒ" all become "xr".
  function key(s) {
    return String(s || "").normalize("NFKC").trim().replace(/^@+/, "").replace(/\s+/g, " ").toLowerCase();
  }
  function num(s) {
    if (s == null) return null;
    let t = String(s).trim();
    if (!t || t === "-" || t === "–") return null;
    const neg = /^\(.*\)$/.test(t);
    t = t.replace(/SGD|JPY|S\$/gi, "").replace(/[()\s,¥￥円]/g, "").replace(/[−–]/g, "-");
    const n = parseFloat(t);
    if (!isFinite(n)) return null;
    return neg ? -n : n;
  }
  const sgdFmt = new Intl.NumberFormat("en-SG", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const jpyFmt = new Intl.NumberFormat("ja-JP", { maximumFractionDigits: 0 });
  function sgd(n) { return (n < 0 ? "−" : "") + "S$" + sgdFmt.format(Math.abs(n)); }
  function jpy(n) { return (n < 0 ? "−" : "") + "¥" + jpyFmt.format(Math.abs(n)); }

  // Small RFC 4180 CSV parser (quotes, escaped quotes, CRLF, newlines inside quotes).
  function parseCSV(text) {
    text = text.replace(/^﻿/, "");
    const rows = []; let row = [], field = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
        else field += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); rows.push(row); row = []; field = "";
      } else field += c;
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    return rows.filter((r) => r.some((x) => x.trim() !== ""));
  }
  // Turn CSV rows into objects using the header row; looks columns up by how the header starts.
  function table(text, cols) {
    const rows = parseCSV(text);
    if (!rows.length) return [];
    const head = rows[0].map((h) => h.trim().toLowerCase());
    const idx = {};
    for (const [name, prefix] of Object.entries(cols)) idx[name] = head.findIndex((h) => h.startsWith(prefix));
    return rows.slice(1).map((r) => {
      const o = {};
      for (const name in idx) o[name] = idx[name] >= 0 ? (r[idx[name]] || "").trim() : "";
      return o;
    });
  }

  async function fetchText(url) {
    const u = new URL(url);
    u.searchParams.set("_", Date.now());          // skip stale browser cache
    const res = await fetch(u.toString(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    if (/^\s*<(!doctype|html)/i.test(text)) throw new Error("Got a web page, not CSV. Is the link the CSV publish link?");
    return text;
  }

  async function load() {
    if (!ORDERS_CSV_URL || !HANDLES_CSV_URL) throw new Error("not-configured");
    const [o, h] = await Promise.all([fetchText(ORDERS_CSV_URL), fetchText(HANDLES_CSV_URL)]);
    const orders = table(o, {
      person: "person", item: "item", qty: "qty", sgd: "sgd", jpy: "jpy", rate: "rate",
      pay: "payment", stage: "stage", batch: "batch", note: "note"
    }).filter((r) => r.person && r.item);
    const handles = table(h, { person: "person", handles: "telegram" }).filter((r) => r.person);
    return { orders, handles };
  }

  /* ---------- lookup ---------- */
  function findPerson(query) {
    const k = key(query);
    if (!k) return null;
    const names = new Map();                          // key -> display name
    for (const r of data.orders) names.set(key(r.person), r.person);
    for (const r of data.handles) if (!names.has(key(r.person))) names.set(key(r.person), r.person);
    if (names.has(k)) return names.get(k);
    for (const r of data.handles) {
      const hs = r.handles.split(/[\s,;\/|]+/).map(key).filter(Boolean);
      if (hs.includes(k)) return r.person;
    }
    return null;
  }

  /* ---------- rendering ---------- */
  function payPill(p) {
    const s = p.toUpperCase().trim();
    const cls = { "PAID": "paid", "NOT PAID": "notpaid", "DEDUCTED": "deducted", "CREDIT": "credit" }[s] || "tbc";
    return `<span class="pill ${cls}">${esc(PAY_LABEL[s] || s || "To confirm")}</span>`;
  }

  function tracker(stage) {
    const s = stage.toUpperCase().trim();
    const at = s in STAGE_INDEX ? STAGE_INDEX[s] : -1;
    const lis = STEPS.map((name, i) => {
      const cls = [i < at ? "done" : "", i === at ? "done now" : ""].join(" ").trim();
      return `<li class="${cls}">${name}</li>`;
    }).join("");
    return `<ol class="tracker" aria-label="Progress">${lis}</ol>`;
  }

  function itemRow(r, withTracker) {
    const qty = num(r.qty), s = num(r.sgd), j = num(r.jpy), rate = num(r.rate);
    const meta = [];
    if (qty != null) meta.push(`<span>×${esc(qty)}</span>`);
    else if (r.qty) meta.push(`<span>${esc(r.qty)}</span>`);
    if (s != null) meta.push(`<span class="money">${sgd(s)}</span>`);
    if (j != null) meta.push(`<span class="money">${jpy(j)}</span>`);
    if (rate != null) meta.push(`<span>${esc(rate.toFixed(6))} S$/¥</span>`);
    if (r.batch) meta.push(`<span>${esc(r.batch)}</span>`);

    const st = r.stage.toUpperCase().trim();
    const stageText = STAGE_LABEL[st] || r.stage;
    return `
      <article class="row">
        <div class="row-head">
          <div class="row-title">${esc(r.item)}</div>
          ${payPill(r.pay)}
        </div>
        ${meta.length ? `<div class="meta">${meta.join("")}</div>` : ""}
        ${withTracker ? tracker(r.stage) + `<div class="stage">${esc(stageText)}</div>` : ""}
        ${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}
      </article>`;
  }

  function section(id, title, rows, withTracker, emptyText) {
    let html = `<section data-sec="${id}"><div class="sec-head"><h2>${esc(title)}</h2><span class="n">${rows.length}</span></div>`;
    html += rows.length ? rows.map((r) => itemRow(r, withTracker)).join("") : `<p class="empty">${esc(emptyText)}</p>`;
    return html + `</section>`;
  }

  function render(person) {
    const pk = key(person);
    const mine = data.orders.filter((r) => key(r.person) === pk);   // ONLY this person's rows

    let owe = 0, oweJpyOnly = 0;
    for (const r of mine) {
      const p = r.pay.toUpperCase().trim();
      if (p !== "NOT PAID" && p !== "CREDIT") continue;
      const s = num(r.sgd), j = num(r.jpy);
      if (s != null) owe += s; else if (j != null) oweJpyOnly += j;
    }
    owe = Math.round(owe * 100) / 100;

    let label = "Still to pay", amount, hint;
    if (owe > 0) { amount = sgd(owe); hint = "Unpaid items, minus anything DX owes you."; }
    else if (owe < 0) { label = "Credit"; amount = sgd(-owe); hint = "DX owes you this much."; }
    else { amount = "S$0.00"; hint = "All settled. Thank you!"; }
    if (oweJpyOnly) hint += ` Plus ${jpy(oweJpyOnly)} still to convert.`;

    const onTheWay = mine.filter((r) => r.stage.trim() && r.stage.toUpperCase().trim() !== "DELIVERED");
    const delivered = mine.filter((r) => r.stage.toUpperCase().trim() === "DELIVERED");
    const adjust = mine.filter((r) => !r.stage.trim());

    summaryEl.innerHTML = `
      <div class="hello">Hi, ${esc(person)}</div>
      <div class="label">${label}</div>
      <div class="amount">${amount}</div>
      <div class="hint">${esc(hint)}</div>
      <div class="counts">
        <div><b>${onTheWay.length}</b>on the way</div>
        <div><b>${delivered.length}</b>delivered</div>
        ${adjust.length ? `<div><b>${adjust.length}</b>adjustments</div>` : ""}
      </div>`;

    const filters = [["all", "All"], ["way", "On the way"], ["done", "Delivered"]];
    if (adjust.length) filters.push(["adj", "Credits"]);
    let html = `<div class="chips-row" role="group" aria-label="Filter">` +
      filters.map(([id, name], i) => `<button type="button" class="fchip" data-f="${id}" aria-pressed="${i === 0}">${name}</button>`).join("") +
      `</div>`;
    html += section("way", "On the way", onTheWay, true, "Nothing on the way right now.");
    html += section("done", "Delivered", delivered, true, "Nothing delivered yet.");
    if (adjust.length) html += section("adj", "Credits & adjustments", adjust, false, "");

    result.innerHTML = html;
    result.querySelectorAll(".fchip").forEach((b) => b.addEventListener("click", () => {
      result.querySelectorAll(".fchip").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      const f = b.dataset.f;
      result.querySelectorAll("section[data-sec]").forEach((s) => s.classList.toggle("hidden", f !== "all" && s.dataset.sec !== f));
    }));

    statusEl.classList.add("hidden");
    summaryEl.classList.remove("hidden");
    result.classList.remove("hidden");
    document.body.classList.add("has-result");
  }

  function showMsg(html) {
    statusEl.innerHTML = html;
    statusEl.classList.remove("hidden");
    summaryEl.classList.add("hidden");
    result.classList.add("hidden");
    summaryEl.innerHTML = ""; result.innerHTML = "";
    document.body.classList.remove("has-result");
  }

  function search(q) {
    if (loadError) return showLoadError();
    if (!data) return;
    const person = findPerson(q);
    if (!person) {
      showMsg(`Hmm, I couldn't find <strong>${esc(q.trim())}</strong>. Check the spelling or try your Telegram @. Still stuck? Message DX.`);
      return;
    }
    render(person);
  }

  function showLoadError() {
    if (loadError && loadError.message === "not-configured") {
      showMsg("This page isn't set up yet. The sheet links still need to be added.");
    } else {
      showMsg("Oops, I couldn't load the order sheet just now. Please check your connection and refresh in a bit.");
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const q = input.value;
    if (!key(q)) return;
    history.replaceState(null, "", "#" + encodeURIComponent(q.trim()));  // bookmarkable, never sent to a server
    search(q);
    input.blur();
  });

  /* ---------- start ---------- */
  btn.disabled = true;
  load().then((d) => {
    data = d;
    btn.disabled = false;
    $("foot").textContent = "Updated " + new Date().toLocaleString("en-SG", { dateStyle: "medium", timeStyle: "short" }) + " · refresh for the latest";
    const fromHash = decodeURIComponent(location.hash.slice(1) || "");
    if (fromHash) { input.value = fromHash; search(fromHash); }
    else showMsg("Enter your name or Telegram handle to see your orders.");
  }).catch((err) => {
    loadError = err;
    btn.disabled = false;
    console.warn("Order sheet failed to load:", err.message);
    showLoadError();
  });
})();
</script>
</body>
</html>
