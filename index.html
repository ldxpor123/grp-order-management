<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Order Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<script>
/* =====================================================================
   CONFIG — paste your Google Sheets "Publish to web" CSV links here.
   File > Share > Publish to web > pick the tab > "Comma-separated values (.csv)"
   They look like:
   https://docs.google.com/spreadsheets/d/e/2PACX-.../pub?gid=0&single=true&output=csv
   ===================================================================== */
const ORDERS_CSV_URL  = "";
const HANDLES_CSV_URL = "";
/* ===================================================================== */
</script>
<style>
  :root {
    --bg: #f6f2ff;
    --bg-2: #efe8ff;
    --card: #ffffff;
    --ink: #3d3357;
    --ink-soft: #7a6e98;
    --line: #e4dbfa;
    --accent: #9b7fe6;
    --accent-ink: #ffffff;
    --accent-soft: #ece4ff;
    --track-off: #e6e0f5;
    --shadow: 0 6px 20px rgba(120, 90, 200, .12);
    --total-a: #7a5fd0; --total-b: #a688ee;

    --paid-bg: #dcf6e6;   --paid-ink: #2f7a4f;
    --unpaid-bg: #ffdfe7; --unpaid-ink: #b23a5c;
    --ded-bg: #dfecff;    --ded-ink: #3b62a8;
    --credit-bg: #fff1c9; --credit-ink: #8a6410;
    --tbc-bg: #eeeaf5;    --tbc-ink: #6f6888;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1726;
      --bg-2: #221d31;
      --card: #2a2440;
      --ink: #ece6ff;
      --ink-soft: #b2a8d4;
      --line: #3b3358;
      --accent: #b9a2ff;
      --accent-ink: #1b1726;
      --accent-soft: #3a3060;
      --track-off: #423a62;
      --shadow: 0 6px 20px rgba(0, 0, 0, .35);
      --total-a: #b9a2ff; --total-b: #d6c4ff;

      --paid-bg: #1f4232;   --paid-ink: #9ee6bb;
      --unpaid-bg: #4d2433; --unpaid-ink: #ffb3c7;
      --ded-bg: #22365a;    --ded-ink: #a9c6ff;
      --credit-bg: #4a3a12; --credit-ink: #ffd97a;
      --tbc-bg: #37314d;    --tbc-ink: #c7bfe0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1726; --bg-2: #221d31; --card: #2a2440; --ink: #ece6ff; --ink-soft: #b2a8d4;
    --line: #3b3358; --accent: #b9a2ff; --accent-ink: #1b1726; --accent-soft: #3a3060;
    --track-off: #423a62; --shadow: 0 6px 20px rgba(0,0,0,.35); --total-a: #b9a2ff; --total-b: #d6c4ff;
    --paid-bg: #1f4232; --paid-ink: #9ee6bb; --unpaid-bg: #4d2433; --unpaid-ink: #ffb3c7;
    --ded-bg: #22365a; --ded-ink: #a9c6ff; --credit-bg: #4a3a12; --credit-ink: #ffd97a;
    --tbc-bg: #37314d; --tbc-ink: #c7bfe0;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(120% 60% at 50% 0%, var(--bg-2), var(--bg) 70%) fixed, var(--bg);
    color: var(--ink);
    font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold",
                 "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 16px 48px; }

  header { text-align: center; margin-bottom: 20px; }
  .logo { font-size: 40px; line-height: 1; }
  h1 { font-size: 26px; font-weight: 800; margin: 8px 0 4px; letter-spacing: .01em; }
  .sub { color: var(--ink-soft); margin: 0; font-size: 15px; }

  form.search {
    display: flex; gap: 8px;
    background: var(--card); padding: 8px; border-radius: 999px;
    box-shadow: var(--shadow); border: 2px solid var(--line);
  }
  form.search:focus-within { border-color: var(--accent); }
  .search input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink);
    font: inherit; font-size: 17px; padding: 8px 4px 8px 14px;
  }
  .search input::placeholder { color: var(--ink-soft); opacity: .8; }
  .search button {
    border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 700; font-size: 16px;
  }
  .search button:disabled { opacity: .6; cursor: progress; }

  .msg {
    margin-top: 20px; text-align: center; background: var(--card); border-radius: 24px;
    padding: 22px 18px; box-shadow: var(--shadow); border: 2px dashed var(--line);
  }
  .msg .emoji { font-size: 34px; }
  .msg p { margin: 6px 0 0; color: var(--ink-soft); }
  .msg strong { color: var(--ink); }

  .hello { margin: 24px 4px 10px; font-size: 20px; font-weight: 800; }
  .total {
    background: linear-gradient(135deg, var(--total-a), var(--total-b));
    color: #fff; border-radius: 26px; padding: 18px 20px; box-shadow: var(--shadow);
  }
  :root[data-theme="dark"] .total { color: #1b1726; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .total { color: #1b1726; } }
  .total .label { font-weight: 700; font-size: 14px; opacity: .9; }
  .total .amount { font-size: 38px; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .total .hint { font-size: 13px; opacity: .9; margin-top: 2px; }

  h2 {
    font-size: 17px; font-weight: 800; margin: 28px 4px 10px;
    display: flex; align-items: center; gap: 8px;
  }
  h2 .count {
    font-size: 13px; font-weight: 700; background: var(--accent-soft); color: var(--ink);
    border-radius: 999px; padding: 1px 9px;
  }

  .item {
    background: var(--card); border-radius: 22px; padding: 16px; margin-bottom: 12px;
    box-shadow: var(--shadow); border: 1px solid var(--line);
  }
  .item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .item-name { font-weight: 700; font-size: 16px; }
  .pill {
    flex: none; font-size: 12px; font-weight: 800; letter-spacing: .03em; border-radius: 999px;
    padding: 3px 10px; white-space: nowrap;
  }
  .pill.paid { background: var(--paid-bg); color: var(--paid-ink); }
  .pill.notpaid { background: var(--unpaid-bg); color: var(--unpaid-ink); }
  .pill.deducted { background: var(--ded-bg); color: var(--ded-ink); }
  .pill.credit { background: var(--credit-bg); color: var(--credit-ink); }
  .pill.tbc { background: var(--tbc-bg); color: var(--tbc-ink); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    font-size: 13px; background: var(--accent-soft); border-radius: 10px; padding: 2px 9px;
    font-variant-numeric: tabular-nums;
  }
  .chip.money { font-weight: 700; }

  .tracker { list-style: none; display: flex; margin: 16px 0 6px; padding: 0; }
  .tracker li { flex: 1; text-align: center; position: relative; font-size: 11.5px; color: var(--ink-soft); }
  .tracker li::before {
    content: ""; display: block; width: 16px; height: 16px; margin: 0 auto 4px; border-radius: 50%;
    background: var(--track-off); position: relative; z-index: 1; border: 3px solid var(--card);
    box-sizing: content-box;
  }
  .tracker li + li::after {
    content: ""; position: absolute; top: 9px; right: 50%; width: 100%; height: 4px;
    background: var(--track-off); border-radius: 4px;
  }
  .tracker li.done { color: var(--ink); }
  .tracker li.done::before, .tracker li.done::after { background: var(--accent); }
  .tracker li.now { font-weight: 800; color: var(--ink); }
  .tracker li.now::before { box-shadow: 0 0 0 4px var(--accent-soft); }

  .stage { font-size: 14px; margin-top: 6px; }
  .stage b { font-weight: 800; }
  .note { font-size: 13.5px; color: var(--ink-soft); margin-top: 4px; }

  .empty { color: var(--ink-soft); font-size: 14px; margin: 0 4px; }

  footer { text-align: center; color: var(--ink-soft); font-size: 12.5px; margin-top: 32px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">🌸</div>
    <h1>Group Order Tracker</h1>
    <p class="sub">Type your name or Telegram @ to see your goods ✨</p>
  </header>

  <form class="search" id="form" autocomplete="off">
    <label for="q" class="hidden">Your name or Telegram handle</label>
    <input id="q" name="q" type="search" inputmode="text" autocapitalize="none" spellcheck="false"
           placeholder="e.g. @yourhandle" required>
    <button id="go" type="submit">Find</button>
  </form>

  <div id="status" class="msg" role="status" aria-live="polite">
    <div class="emoji">⏳</div>
    <p>Loading the order sheet…</p>
  </div>

  <main id="result" class="hidden" aria-live="polite"></main>

  <footer id="foot"></footer>
</div>

<script>
(function () {
  "use strict";

  const STEPS = ["Ordered", "At warehouse", "Shipping", "Delivered"];
  const STAGE_INDEX = { "ORDERED": 0, "AT WAREHOUSE": 1, "SHIPPING TO SG": 2, "SHIPPING": 2, "DELIVERED": 3 };
  const STAGE_LABEL = {
    "ORDERED": "Ordered, waiting for the Japan release",
    "AT WAREHOUSE": "Arrived at the Buy&Ship warehouse",
    "SHIPPING TO SG": "On the way to Singapore",
    "SHIPPING": "On the way to Singapore",
    "DELIVERED": "Delivered",
    "NO UPDATE": "No update yet"
  };

  const $ = (id) => document.getElementById(id);
  const form = $("form"), input = $("q"), btn = $("go"), statusEl = $("status"), result = $("result");

  let data = null;        // { orders: [...], handles: [...] }
  let loadError = null;

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  // Exact, case-insensitive match key. "@XR", "xr", "ｘｒ" all become "xr".
  function key(s) {
    return String(s || "").normalize("NFKC").trim().replace(/^@+/, "").replace(/\s+/g, " ").toLowerCase();
  }
  function num(s) {
    if (s == null) return null;
    let t = String(s).trim();
    if (!t || t === "-" || t === "–") return null;
    let neg = /^\(.*\)$/.test(t);
    t = t.replace(/SGD|JPY|S\$/gi, "").replace(/[()\s,¥￥円]/g, "").replace(/[−–]/g, "-");
    const n = parseFloat(t);
    if (!isFinite(n)) return null;
    return neg ? -n : n;
  }
  const sgdFmt = new Intl.NumberFormat("en-SG", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const jpyFmt = new Intl.NumberFormat("ja-JP", { maximumFractionDigits: 0 });
  function sgd(n) { return (n < 0 ? "−" : "") + "S$" + sgdFmt.format(Math.abs(n)); }
  function jpy(n) { return (n < 0 ? "−" : "") + "¥" + jpyFmt.format(Math.abs(n)); }

  // Small RFC 4180 CSV parser (quotes, escaped quotes, CRLF, newlines inside quotes).
  function parseCSV(text) {
    text = text.replace(/^﻿/, "");
    const rows = []; let row = [], field = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
        else field += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); rows.push(row); row = []; field = "";
      } else field += c;
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    return rows.filter((r) => r.some((x) => x.trim() !== ""));
  }
  // Turn CSV rows into objects using the header row; looks columns up by how the header starts.
  function table(text, cols) {
    const rows = parseCSV(text);
    if (!rows.length) return [];
    const head = rows[0].map((h) => h.trim().toLowerCase());
    const idx = {};
    for (const [name, prefix] of Object.entries(cols)) idx[name] = head.findIndex((h) => h.startsWith(prefix));
    return rows.slice(1).map((r) => {
      const o = {};
      for (const name in idx) o[name] = idx[name] >= 0 ? (r[idx[name]] || "").trim() : "";
      return o;
    });
  }

  async function fetchText(url) {
    const u = new URL(url);
    u.searchParams.set("_", Date.now());          // skip stale browser cache
    const res = await fetch(u.toString(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    if (/^\s*<(!doctype|html)/i.test(text)) throw new Error("Got a web page, not CSV. Is the link the CSV publish link?");
    return text;
  }

  async function load() {
    if (!ORDERS_CSV_URL || !HANDLES_CSV_URL) throw new Error("not-configured");
    const [o, h] = await Promise.all([fetchText(ORDERS_CSV_URL), fetchText(HANDLES_CSV_URL)]);
    const orders = table(o, {
      person: "person", item: "item", qty: "qty", sgd: "sgd", jpy: "jpy", rate: "rate",
      pay: "payment", stage: "stage", batch: "batch", note: "note"
    }).filter((r) => r.person && r.item);
    const handles = table(h, { person: "person", handles: "telegram" }).filter((r) => r.person);
    return { orders, handles };
  }

  /* ---------- lookup ---------- */
  function findPerson(query) {
    const k = key(query);
    if (!k) return null;
    const names = new Map();                          // key -> display name
    for (const r of data.orders) names.set(key(r.person), r.person);
    for (const r of data.handles) if (!names.has(key(r.person))) names.set(key(r.person), r.person);
    if (names.has(k)) return names.get(k);
    for (const r of data.handles) {
      const hs = r.handles.split(/[\s,;\/|]+/).map(key).filter(Boolean);
      if (hs.includes(k)) return r.person;
    }
    return null;
  }

  /* ---------- rendering ---------- */
  function payPill(p) {
    const s = p.toUpperCase().trim();
    const cls = { "PAID": "paid", "NOT PAID": "notpaid", "DEDUCTED": "deducted", "CREDIT": "credit" }[s] || "tbc";
    return `<span class="pill ${cls}">${esc(s || "TO CONFIRM")}</span>`;
  }

  function tracker(stage) {
    const s = stage.toUpperCase().trim();
    const at = s in STAGE_INDEX ? STAGE_INDEX[s] : -1;
    const lis = STEPS.map((name, i) =>
      `<li class="${i <= at ? "done" : ""} ${i === at ? "now" : ""}">${name}</li>`).join("");
    return `<ol class="tracker" aria-label="Progress">${lis}</ol>`;
  }

  function itemCard(r, withTracker) {
    const qty = num(r.qty), s = num(r.sgd), j = num(r.jpy), rate = num(r.rate);
    const chips = [];
    if (qty != null) chips.push(`<span class="chip">×${esc(qty)}</span>`);
    else if (r.qty) chips.push(`<span class="chip">${esc(r.qty)}</span>`);
    if (s != null) chips.push(`<span class="chip money">${sgd(s)}</span>`);
    if (j != null) chips.push(`<span class="chip money">${jpy(j)}</span>`);
    if (rate != null) chips.push(`<span class="chip">rate ${esc(rate.toFixed(6))} S$/¥</span>`);
    if (r.batch) chips.push(`<span class="chip">📦 ${esc(r.batch)}</span>`);

    const st = r.stage.toUpperCase().trim();
    const stageText = STAGE_LABEL[st] || r.stage;
    return `
      <article class="item">
        <div class="item-top">
          <div class="item-name">${esc(r.item)}</div>
          ${payPill(r.pay)}
        </div>
        <div class="chips">${chips.join("")}</div>
        ${withTracker ? tracker(r.stage) + `<div class="stage"><b>${esc(stageText)}</b></div>` : ""}
        ${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}
      </article>`;
  }

  function section(title, emoji, rows, withTracker, emptyText) {
    let html = `<h2><span aria-hidden="true">${emoji}</span>${esc(title)} <span class="count">${rows.length}</span></h2>`;
    html += rows.length ? rows.map((r) => itemCard(r, withTracker)).join("") : `<p class="empty">${esc(emptyText)}</p>`;
    return html;
  }

  function render(person) {
    const pk = key(person);
    const mine = data.orders.filter((r) => key(r.person) === pk);   // ONLY this person's rows

    let owe = 0, oweJpyOnly = 0;
    for (const r of mine) {
      const p = r.pay.toUpperCase().trim();
      if (p !== "NOT PAID" && p !== "CREDIT") continue;
      const s = num(r.sgd), j = num(r.jpy);
      if (s != null) owe += s; else if (j != null) oweJpyOnly += j;
    }
    owe = Math.round(owe * 100) / 100;

    let amount, hint;
    if (owe > 0) { amount = sgd(owe); hint = "Unpaid items, minus anything DX owes you 💜"; }
    else if (owe < 0) { amount = sgd(-owe); hint = "DX owes you this much 💜"; }
    else { amount = "S$0.00"; hint = "All settled, thank you! 🎉"; }
    if (oweJpyOnly) hint += ` · plus ${jpy(oweJpyOnly)} still to convert`;

    const onTheWay = mine.filter((r) => r.stage.trim() && r.stage.toUpperCase().trim() !== "DELIVERED");
    const delivered = mine.filter((r) => r.stage.toUpperCase().trim() === "DELIVERED");
    const adjust = mine.filter((r) => !r.stage.trim());

    let html = `<div class="hello">Hi ${esc(person)}! 👋</div>
      <div class="total">
        <div class="label">${owe < 0 ? "Credit" : "Still to pay"}</div>
        <div class="amount">${amount}</div>
        <div class="hint">${esc(hint)}</div>
      </div>`;
    html += section("On the way", "🚚", onTheWay, true, "Nothing on the way right now.");
    html += section("Delivered", "🎀", delivered, true, "Nothing delivered yet.");
    if (adjust.length) html += section("Credits & adjustments", "🧾", adjust, false, "");
    if (!mine.length) html += `<p class="empty" style="margin-top:16px">No orders listed for you yet.</p>`;

    result.innerHTML = html;
    result.classList.remove("hidden");
    statusEl.classList.add("hidden");
  }

  function showMsg(emoji, html) {
    statusEl.innerHTML = `<div class="emoji">${emoji}</div><p>${html}</p>`;
    statusEl.classList.remove("hidden");
    result.classList.add("hidden");
    result.innerHTML = "";
  }

  function search(q) {
    if (loadError) return showLoadError();
    if (!data) return;
    const person = findPerson(q);
    if (!person) {
      showMsg("🥺", `Hmm, I couldn't find <strong>${esc(q.trim())}</strong>.<br>
        Check the spelling, or try your Telegram @ instead. Still stuck? Message DX 💌`);
      return;
    }
    render(person);
  }

  function showLoadError() {
    if (loadError && loadError.message === "not-configured") {
      showMsg("🛠️", "This page isn't set up yet. The sheet links still need to be added.");
    } else {
      showMsg("☁️", "Oops, I couldn't load the order sheet just now.<br>Please check your connection and refresh in a bit 🙏");
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const q = input.value;
    if (!key(q)) return;
    history.replaceState(null, "", "#" + encodeURIComponent(q.trim()));  // bookmarkable, never sent to a server
    search(q);
    input.blur();
  });

  /* ---------- start ---------- */
  btn.disabled = true;
  load().then((d) => {
    data = d;
    btn.disabled = false;
    $("foot").textContent = "Updated " + new Date().toLocaleString("en-SG", { dateStyle: "medium", timeStyle: "short" }) + " · refresh to get the latest";
    const fromHash = decodeURIComponent(location.hash.slice(1) || "");
    if (fromHash) { input.value = fromHash; search(fromHash); }
    else showMsg("🔎", "Enter your name or Telegram handle above to see your orders.");
  }).catch((err) => {
    loadError = err;
    btn.disabled = false;
    console.warn("Order sheet failed to load:", err.message);
    showLoadError();
  });
})();
</script>
</body>
</html>
